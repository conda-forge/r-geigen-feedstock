{% set version = "2.4" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-geigen
  version: {{ version|replace("-", "_") }}

source:
  fn: geigen_{{ version }}.tar.gz
  url:
    - {{ cran_mirror }}/src/contrib/geigen_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/geigen/geigen_{{ version }}.tar.gz
  sha256: 825dd78060159581cddbac82c4ce07311300407376b9c5afaf7cc2c12fa3c884

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}        # [build_platform != target_platform]
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib("c") }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('fortran') }}        # [not win]
    - {{ compiler('m2w64_fortran') }}  # [win]
    - {{ posix }}filesystem            # [win]
    - {{ posix }}make
    - {{ posix }}sed                   # [win]
    - {{ posix }}coreutils             # [win]
    - {{ posix }}zip                   # [win]
  host:
    - r-base
    - libblas
    - liblapack
  run:
    - r-base

test:
  commands:
    - $R -e "library('geigen')"           # [not win]
    - "\"%R%\" -e \"library('geigen')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=geigen
  license: GPL-2.0-or-later
  summary: Functions to compute generalized eigenvalues and eigenvectors, the generalized Schur decomposition and the generalized Singular Value Decomposition of a matrix pair, using Lapack routines.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
